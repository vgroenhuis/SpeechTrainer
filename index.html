<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speech Trainer</title>
<style>
:root{
  --bg:#0f1420; --panel:#182032; --panel2:#202a40; --text:#eef2fa; --muted:#9aa6bf; --line:#2c3854;
  --good:#22c08a; --ok:#f5a524; --bad:#f0524f; --accent:#4f8ef7;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.45 system-ui,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px 18px;background:var(--panel);border-bottom:1px solid var(--line)}
h1{font-size:22px;margin:0 12px 0 0}
.tabs{display:flex;gap:6px}
.tabs button{font-size:17px}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.spacer{flex:1}
label.sel{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:15px}
select,button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 14px}
button{cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.big{font-size:22px;padding:14px 28px;border-radius:14px}
button.rec{background:var(--bad);border-color:var(--bad)}
main{padding:16px 18px;max-width:1300px;margin:0 auto;display:grid;gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.hidden{display:none!important}
.muted{color:var(--muted)}
/* Explore */
.now{display:grid;grid-template-columns:minmax(260px,1.3fr) 1fr 1fr;gap:16px}
.tile{background:var(--panel2);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;min-height:150px}
.tile .cap{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
#nowLabel{font-size:40px;font-weight:700;line-height:1.1}
#nowSub{font-size:18px;color:var(--muted)}
#nowSym{font-size:64px;font-weight:700;align-self:flex-end;margin-top:-70px;opacity:.9}
.voice{font-size:28px;font-weight:700}
.meter{height:22px;background:#0c111b;border-radius:11px;overflow:hidden}
.meter>div{height:100%;width:0;background:linear-gradient(90deg,var(--good),var(--ok),var(--bad));transition:width .05s}
.guide{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.gcard{border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel2);transition:transform .1s,border-color .1s}
.gcard b{font-size:18px}
.gcard.on{transform:scale(1.03)}
.gcard .sw{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:6px;vertical-align:-1px}
/* Viz */
.viz{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
canvas{width:100%;display:block;border-radius:10px;background:#000}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:14px;color:var(--muted);margin-top:8px}
.legend span i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
h2{font-size:17px;margin:0 0 8px;color:var(--muted);font-weight:600}
/* Words */
.wordtop{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:12px}
.wordcard{text-align:center;padding:10px 0 4px}
#word{font-size:84px;font-weight:800;letter-spacing:.02em;line-height:1.1}
#ipa{font-size:24px;color:var(--muted);margin-top:4px}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.chip{min-width:58px;padding:6px 12px;border-radius:12px;font-size:26px;font-weight:700;color:#0b0f18;text-align:center;position:relative}
.chip small{display:block;font-size:12px;font-weight:600;opacity:.8}
.chip .mark{position:absolute;top:-10px;right:-8px;font-size:18px;background:var(--panel);border-radius:50%;width:26px;height:26px;line-height:26px;border:2px solid var(--line)}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#status{text-align:center;min-height:28px;margin-top:10px;font-size:18px;color:var(--muted)}
.result{display:grid;grid-template-columns:200px 1fr;gap:20px;align-items:start;margin-top:8px}
.score{width:180px;height:180px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;border:10px solid var(--line);font-size:56px;font-weight:800}
.score small{font-size:15px;font-weight:600;color:var(--muted)}
.bars{display:grid;gap:8px;margin-bottom:12px}
.bar{display:grid;grid-template-columns:170px 1fr 48px;gap:10px;align-items:center;font-size:15px}
.bar .meter{height:16px}
.fb{margin:0;padding-left:20px}
.fb li{margin:6px 0}
.timeline{display:flex;gap:3px;margin:8px 0 4px;flex-wrap:wrap}
.timeline div{padding:3px 8px;border-radius:6px;font-size:14px;font-weight:700;color:#0b0f18}
.warn{background:#3a2a10;border:1px solid var(--ok);border-radius:12px;padding:10px 14px}
.axis-help{font-size:14px;margin:8px 0 0}
.details{display:grid;grid-template-columns:1fr 1.1fr;gap:20px;align-items:start}
.dgrid{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center;font-size:16px}
.dgrid .k{color:var(--muted);font-size:14px}
.dgrid .v b{font-size:20px}
.dgrid .why{color:var(--muted);font-size:14px}
.ebar{display:grid;grid-template-columns:minmax(150px,230px) 1fr 44px;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.ebar .meter{height:14px}
.ebar .meter>div{background:var(--accent)}
#picSwitch button{padding:5px 12px;font-size:15px}
.sylsep{align-self:center;font-size:30px;font-weight:800;color:var(--muted);margin:0 2px}
@media (max-width:900px){.now,.viz,.result,.details{grid-template-columns:1fr}#word{font-size:60px}}
</style>
</head>
<body>
<header>
  <h1 data-t="title">Speech Trainer</h1>
  <div class="tabs">
    <button id="tabExplore" class="on" data-t="tabExplore">Explore sounds</button>
    <button id="tabWords" data-t="tabWords">Practise words</button>
  </div>
  <div class="spacer"></div>
  <label class="sel"><span data-t="language">Language</span>
    <select id="lang"><option value="nl">Nederlands</option><option value="en">English</option></select></label>
  <label class="sel"><span data-t="voiceType">Voice</span>
    <select id="voiceType">
      <option value="auto" data-t="vAuto">Automatic</option>
      <option value="1" data-t="vLow">Low (man)</option>
      <option value="1.18" data-t="vMid">Medium (woman)</option>
      <option value="1.32" data-t="vHigh">High (child)</option>
    </select></label>
</header>

<main>
  <div id="support" class="warn hidden"></div>

  <!-- EXPLORE -->
  <section id="explorePanel" class="panel">
    <div class="wordtop">
      <button id="micBtn" class="primary big" data-t="micStart">🎤 Start microphone</button>
      <span class="muted" data-t="exploreHelp">Make a sound and watch what happens. Colours show the type of sound.</span>
    </div>
    <div class="now">
      <div class="tile">
        <div class="cap" data-t="nowHearing">Now hearing</div>
        <div id="nowLabel">—</div>
        <div id="nowSub"></div>
        <div id="nowSym"></div>
      </div>
      <div class="tile">
        <div class="cap" data-t="voiceCap">Voice (vocal folds)</div>
        <div id="voiceState" class="voice">—</div>
        <div id="pitchVal" class="muted"></div>
        <div class="muted" style="font-size:14px" data-t="voiceHint"></div>
      </div>
      <div class="tile">
        <div class="cap" data-t="loudCap">Loudness</div>
        <div class="meter"><div id="loudBar"></div></div>
        <div id="loudTxt" class="muted"></div>
      </div>
    </div>
    <div class="guide" id="guide" style="margin-top:16px"></div>
  </section>

  <!-- WORDS -->
  <section id="wordPanel" class="panel hidden">
    <div class="wordtop">
      <label class="sel"><span data-t="category">Practise</span> <select id="cat"></select></label>
      <label class="sel"><span data-t="exampleVoice">Example voice</span>
        <select id="exVoice"><option value="male" data-t="exMale">Man</option><option value="female" data-t="exFemale">Woman</option></select></label>
      <div class="spacer"></div>
      <span id="progress" class="muted"></span>
    </div>
    <div class="wordcard">
      <div id="word">—</div>
      <div id="ipa"></div>
      <div class="chips" id="chips"></div>
      <div class="controls">
        <button id="prevBtn" data-t="prev">◀ Previous</button>
        <button id="listenBtn" data-t="listen">🔊 Listen</button>
        <button id="speakBtn" class="primary big" data-t="speak">🎤 Say it</button>
        <button id="nextBtn" data-t="next">Next ▶</button>
      </div>
      <div id="status"></div>
    </div>
    <div id="result" class="result hidden">
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
        <div class="score" id="scoreCircle"><span id="scoreNum">0</span><small data-t="outOf">of 100</small></div>
        <div id="stars" style="font-size:28px"></div>
      </div>
      <div>
        <div class="bars" id="bars"></div>
        <div id="heard" style="margin-bottom:6px"></div>
        <div class="muted" style="font-size:14px" data-t="detected">Detected sounds (in order):</div>
        <div class="timeline" id="timeline"></div>
        <ul class="fb" id="feedback"></ul>
      </div>
    </div>
  </section>

  <!-- SHARED VISUALS -->
  <section class="viz">
    <div class="panel">
      <div class="wordtop" style="margin-bottom:8px">
        <h2 data-t="specTitle" style="margin:0"></h2>
        <div class="spacer"></div>
        <div id="picSwitch" class="tabs hidden">
          <button id="picExample" data-t="picExample">Example</button>
          <button id="picAttempt" data-t="picAttempt">My attempt</button>
        </div>
        <label class="sel"><input type="checkbox" id="showFm" checked> <span data-t="showFm">F1/F2 lines</span></label>
      </div>
      <canvas id="spec" width="1000" height="292"></canvas>
      <div class="legend" id="legend"></div>
      <div id="playRow" class="controls hidden" style="justify-content:flex-start;margin-top:10px">
        <button id="playBtn" class="primary" data-t="play">▶ Play recording</button>
        <button id="slowBtn" data-t="playSlow">🐢 Slow</button>
        <span class="muted" style="align-self:center;font-size:14px" data-t="playHint"></span>
      </div>
    </div>
    <div class="panel">
      <h2 data-t="vowelTitle"></h2>
      <canvas id="vowel" width="520" height="440"></canvas>
      <div class="legend" id="vowelLegend2"></div>
      <p class="muted axis-help" data-t="vowelAxes"></p>
    </div>
  </section>

  <!-- RAW DATA -->
  <section class="panel">
    <h2 data-t="detailsTitle"></h2>
    <p class="muted" style="margin:0 0 10px;font-size:14px" data-t="detailsHelp"></p>
    <div class="details">
      <div id="details" class="dgrid"></div>
      <div>
        <canvas id="mini" width="560" height="230"></canvas>
        <div class="legend" id="miniLegend"></div>
      </div>
    </div>
  </section>
</main>

<script src="data.js"></script>
<script src="analysis.js"></script>

/* ---------- Vowel chart ---------- */
const vc = $('#vowel'), vctx = vc.getContext('2d');

  vctx.textAlign = 'center'; vctx.textBaseline = 'middle';

  try {

    if (!res.ok) throw new Error(res.status);
    const dec = await actx.decodeAudioData(await res.arrayBuffer());
    if (list[idx] !== w) return;   // word changed meanwhile
    const x16 = A.to16k(dec.getChannelData(0), dec.sampleRate);

  const rec = recording; if (!rec || rec.finishing) return;
  rec.finishing = true; live = mode === 'explore' && micOn; recording = null;
  $('#speakBtn').textContent = L.speak; $('#speakBtn').classList.remove('rec');
  $('#status').textContent = L.analysing;
  if (rec.sr && !rec.recDone) { try { rec.sr.stop(); } catch (e) {} setTimeout(() => finish(rec), 2500); }
  else setTimeout(() => finish(rec), 0);
}

/* ---------- Scoring ---------- */
function lev(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
function recognitionScore(rec, w) {
  const unusable = ['not-allowed', 'network', 'service-not-allowed', 'language-not-supported'];
  if (!SR || unusable.includes(rec.recErr)) return { score: null, html: '', exact: false, first: null };
  const alts = rec.results || [];
  if (!alts.length) return { score: 0, html: L.nothingHeard, exact: false, first: null };
  const tw = w.w.toLowerCase();
  let best = 0;
  alts.forEach((a, k) => {
    const words = a.t.split(/\s+/), exact = words.includes(tw);
    const sim = Math.max(...words.map(x => 1 - lev(x, tw) / Math.max(x.length, tw.length)), 1 - lev(a.t, tw) / Math.max(a.t.length, tw.length));
    const conf = a.c > 0 ? a.c : 0.8;
    best = Math.max(best, exact ? (k === 0 ? 70 + 30 * conf : 75 - 8 * k) : Math.max(0, sim) * 55);
  });
  const first = alts[0].t;
  return { score: Math.round(best), first, exact: first.split(/\s+/).includes(tw),
    html: `${L.heard}: <b>“${first}”</b>` + (alts.length > 1 ? ` <span class="muted">(${L.alsoHeard}: ${alts.slice(1, 4).map(a => a.t).join(', ')})</span>` : '') };
}
function finish(rec) {
  if (rec.done) return; rec.done = true;
  const w = rec.word;
  let n = 0; rec.chunks.forEach(c => n += c.length);
  const x = new Float32Array(n); let o = 0; rec.chunks.forEach(c => { x.set(c, o); o += c.length; });
  const an = A.analyzeRecording(x, A.FS);
  const rs = recognitionScore(rec, w);
  const res = A.scoreAttempt(w, an, { lang, scale: currentScale(), recScore: rs.score });
  // learn the speaker's vowel scale from attempts that were clearly the right word
  if (res.meas && (rs.exact || (rs.score == null && res.total >= 70))) {
    const c = calib(); c.push({ lang, target: res.measTarget, f1: res.meas[0], f2: res.meas[1] }); store.set('st_calib', c.slice(-40));
  }
  saveBest(w.w, res.total);
  pending = [];
  pics.attempt = makePic(x, an, 'attempt', typeof res.scale === 'number' ? res.scale : chartScale());
  showPic('attempt');
  renderResult(res, rs, w, pics.attempt.guesses);
}

function renderResult(r, rs, w, guesses) {
  const col = r.total >= 75 ? 'var(--good)' : r.total >= 50 ? 'var(--ok)' : 'var(--bad)';
  $('#scoreNum').textContent = r.total;
  $('#scoreCircle').style.borderColor = col; $('#scoreNum').style.color = col;
  const st = r.total >= 90 ? 4 : r.total >= 75 ? 3 : r.total >= 55 ? 2 : r.total >= 35 ? 1 : 0;
  $('#stars').innerHTML = '★'.repeat(st + 1) + '<span style="opacity:.25">' + '★'.repeat(4 - st) + '</span><div style="font-size:16px;text-align:center">' + L.stars[st] + '</div>';
  const bar = (name, v) => v == null ? '' : `<div class="bar"><span>${name}</span><div class="meter"><div style="width:${v}%;background:${v >= 75 ? 'var(--good)' : v >= 50 ? 'var(--ok)' : 'var(--bad)'}"></div></div><b>${v}</b></div>`;
  $('#bars').innerHTML = bar(L.barRec, r.rec) + bar(L.barSeq, r.seq) + bar(L.barVowel, r.vowel);
  $('#heard').innerHTML = rs.html;
  $('#timeline').innerHTML = r.segs.length ? r.segs.map((s, j) =>
    `<div style="background:${COL[s.c]}">${L.cls[s.c]}${guesses[j] ? ` /${guesses[j]}/` : ''}</div>`).join('') : '<span class="muted">—</span>';
  // feedback: recognition first, then sound issues (with a how-to tip for missing/wrong consonants)
  const fb = [];
  if (rs.first != null) fb.push(rs.exact ? L.fbPerfect : L.fbWrongWord(rs.first, w.w));
  const multi = wordVowels(w).length > 1;
  for (const i of r.issues) {
    if (i.k === 'vowelLike') { fb.push(L.vowelLike(i, vLabel(i.p), vLabel(i.near))); continue; }
    const f = L[i.k]; if (typeof f !== 'function') continue;
    let txt = f(i);
    // in longer words, say which vowel a mouth/tongue tip is about
    if (multi && i.p && ['vOpen', 'vClose', 'vFront', 'vBack'].includes(i.k)) txt = `<b>${i.p}</b> (“${D.VHINT[lang][i.p] || i.p}”): ${txt}`;
    if (['missing', 'place', 'weakBurst', 'aspirated'].includes(i.k) && L.tips[i.p]) txt += ' ' + L.tips[i.p];
    fb.push(txt);
  }
  $('#feedback').innerHTML = fb.map(x => `<li>${x}</li>`).join('');
  $('#chips').innerHTML = chipsHTML(w, r.marks);
  chartResult = r.vowels.filter(v => v.meas).map(v => ({ f1: v.meas[0], f2: v.meas[1], t1: v.t1, t2: v.t2, p: v.p }));
  $('#result').classList.remove('hidden');
  $('#status').textContent = '';
  showProgress();
  drawVowelChart();
}

/* ================= Tabs & settings ================= */
function setMode(m) {
  mode = m;
  $('#tabExplore').classList.toggle('on', m === 'explore'); $('#tabWords').classList.toggle('on', m === 'words');
  $('#explorePanel').classList.toggle('hidden', m !== 'explore'); $('#wordPanel').classList.toggle('hidden', m !== 'words');
  if (recording) stopAttempt();
  if (m === 'explore') { chartTargets = []; chartResult = []; chartExample = []; forgetRecording(true); clearSpec(); live = micOn; }
  else { live = false; showWord(); }
  drawVowelChart();
}
$('#tabExplore').onclick = () => setMode('explore');
$('#tabWords').onclick = () => setMode('words');
$('#lang').onchange = e => { lang = e.target.value; store.set('st_lang', lang); idx = 0; applyLang(); };
$('#voiceType').onchange = e => { voiceSetting = e.target.value; store.set('st_voice2', voiceSetting); applyLang(); };

clearSpec();
applyLang();
</script>
